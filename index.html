<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist Técnico de Retificadores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background-color: #131b26;
      border: 1px solid #243247;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #182232 0%, #101d2d 100%);
      padding: 22px 28px;
      border-bottom: 1px solid #243247;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-info h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .header-info p {
      font-size: 0.8rem;
      color: #8493a8;
      margin-top: 2px;
    }

    .tag-badge {
      background-color: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    form {
      padding: 28px;
    }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 14px 0;
    }

    .section-divider:first-of-type {
      margin-top: 0;
    }

    .section-divider span {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #10b981;
      white-space: nowrap;
    }

    .section-divider .line {
      height: 1px;
      background-color: #243247;
      width: 100%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 500px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8493a8;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background-color: #0e1520;
      border: 1px solid #243247;
      color: #f1f5f9;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      color-scheme: dark;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .select-equipamento {
      border: 1px solid #10b981;
      font-weight: 700;
      background-color: #142433;
    }

    .submit-btn {
      width: 100%;
      margin-top: 18px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover { opacity: 0.95; transform: translateY(-1px); }
    .submit-btn:disabled {
      background: #2a3749;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-box.success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-header">
      <div class="header-info">
        <h1>Checklist Técnico</h1>
        <p>Baterias & Retificadores</p>
      </div>
      <div class="tag-badge" id="badgeTag">CGT-1</div>
    </div>

    <form id="checklistForm">
      <div class="section-divider">
        <span>Local / Equipamento</span>
        <div class="line"></div>
      </div>

      <div class="form-group">
        <label for="equipamento">Selecione o Painel / Retificador</label>
        <select id="equipamento" class="select-equipamento">
          <option value="CGT-1">CGT - 1</option>
          <option value="CGT-2">CGT - 2</option>
          <option value="SUBESTACAO-1">Subestação 1</option>
          <option value="SUBESTACAO-2">Subestação 2</option>
        </select>
      </div>

      <div class="section-divider">
        <span>Informações da Inspeção</span>
        <div class="line"></div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data" required />
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="turno">Turno</label>
          <select id="turno" required>
            <option value="A">Turno A</option>
            <option value="B">Turno B</option>
            <option value="C">Turno C</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nome">Nome do Operador</label>
          <input type="text" id="nome" required placeholder="Ex: Luis / Bruno" />
        </div>
      </div>

      <!-- LAYOUT 1: CGT-1 -->
      <div id="fieldsCgt1">
        <div class="section-divider">
          <span>Baterias</span>
          <div class="line"></div>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label for="cgt1Nivel">Nível</label>
            <input type="text" id="cgt1Nivel" placeholder="Ex: NA, N, MA" />
          </div>
          <div class="form-group">
            <label for="cgt1Alarme">Alarme</label>
            <select id="cgt1Alarme">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cgt1Ahc">AHC %</label>
            <input type="number" step="0.1" id="cgt1Ahc" placeholder="100" />
          </div>
        </div>

        <div class="section-divider">
          <span>Retificador & Consumidor</span>
          <div class="line"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="cgt1RetTensao">Retificador - Tensão (V)</label>
            <input type="number" step="0.1" id="cgt1RetTensao" placeholder="Ex: 132" />
          </div>
          <div class="form-group">
            <label for="cgt1RetCorrente">Retificador - Corrente (A)</label>
            <input type="number" step="0.1" id="cgt1RetCorrente" placeholder="Ex: 5.7" />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="cgt1ConsTensao">Consumidor - Tensão (V)</label>
            <input type="number" step="0.1" id="cgt1ConsTensao" placeholder="Ex: 124" />
          </div>
          <div class="form-group">
            <label for="cgt1ConsCorrente">Consumidor - Corrente (A)</label>
            <input type="number" step="0.1" id="cgt1ConsCorrente" placeholder="Ex: 5.7" />
          </div>
        </div>

        <div class="section-divider">
          <span>Alimentação AC</span>
          <div class="line"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="cgt1Ac">AC (V)</label>
            <input type="number" step="0.1" id="cgt1Ac" placeholder="Ex: 432" />
          </div>
          <div class="form-group">
            <label for="cgt1CorrenteAc">Corrente</label>
            <input type="number" step="0.1" id="cgt1CorrenteAc" placeholder="Ex: 0" />
          </div>
        </div>
      </div>

      <!-- LAYOUT 2: CGT-2 e SUBESTAÇÃO 1 -->
      <div id="fieldsTrifasico" class="hidden">
        <div class="section-divider">
          <span>Baterias (1)</span>
          <div class="line"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="triNivel">Nível</label>
            <input type="text" id="triNivel" placeholder="Ex: NA, N, MA" />
          </div>
          <div class="form-group">
            <label for="triAlarme">Alarme</label>
            <select id="triAlarme">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="triBatTensao">Bateria - Tensão (V)</label>
            <input type="number" step="0.1" id="triBatTensao" />
          </div>
          <div class="form-group">
            <label for="triBatCorrente">Bateria - Corrente (A)</label>
            <input type="number" step="0.1" id="triBatCorrente" />
          </div>
        </div>

        <div class="section-divider">
          <span>Consumidor (2) & Retificador (3)</span>
          <div class="line"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="triConsTensao">Consumidor - Tensão (V)</label>
            <input type="number" step="0.1" id="triConsTensao" />
          </div>
          <div class="form-group">
            <label for="triConsCorrente">Consumidor - Corrente (A)</label>
            <input type="number" step="0.1" id="triConsCorrente" />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="triRetTensao">Retificador - Tensão (V)</label>
            <input type="number" step="0.1" id="triRetTensao" />
          </div>
          <div class="form-group">
            <label for="triRetCorrente">Retificador - Corrente (A)</label>
            <input type="number" step="0.1" id="triRetCorrente" />
          </div>
        </div>

        <div class="section-divider">
          <span>Rede CA (6) Trifásica</span>
          <div class="line"></div>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label for="triRedeR">Fase R</label>
            <input type="number" step="0.1" id="triRedeR" placeholder="V" />
          </div>
          <div class="form-group">
            <label for="triRedeS">Fase S</label>
            <input type="number" step="0.1" id="triRedeS" placeholder="V" />
          </div>
          <div class="form-group">
            <label for="triRedeT">Fase T</label>
            <input type="number" step="0.1" id="triRedeT" placeholder="V" />
          </div>
        </div>
      </div>

      <!-- LAYOUT 3: SUBESTAÇÃO 2 -->
      <div id="fieldsSub2" class="hidden">
        <div class="section-divider">
          <span>Status & Alimentação AC</span>
          <div class="line"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="sub2Alarme">Alarme</label>
            <select id="sub2Alarme">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sub2CorrenteAc">Corrente (AC)</label>
            <input type="number" step="0.1" id="sub2CorrenteAc" />
          </div>
        </div>

        <div class="section-divider">
          <span>Medições CC & Carga</span>
          <div class="line"></div>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label for="sub2Cons">Cons</label>
            <input type="number" step="0.1" id="sub2Cons" />
          </div>
          <div class="form-group">
            <label for="sub2CorBat">Cor Bat</label>
            <input type="number" step="0.1" id="sub2CorBat" />
          </div>
          <div class="form-group">
            <label for="sub2CorCons">Cor Cons</label>
            <input type="number" step="0.1" id="sub2CorCons" />
          </div>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label for="sub2CorTotal">Cor Total</label>
            <input type="number" step="0.1" id="sub2CorTotal" />
          </div>
          <div class="form-group">
            <label for="sub2TempCarga">Temp Carga</label>
            <input type="number" step="0.1" id="sub2TempCarga" placeholder="°C" />
          </div>
          <div class="form-group">
            <label for="sub2RedeFf">Rede (FF)</label>
            <input type="number" step="0.1" id="sub2RedeFf" />
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Gravar Inspeção</span>
      </button>

      <div id="statusMsg" class="status-box"></div>
    </form>
  </div>

  <script>
  // Cole aqui o link Web App da sua implantação
  const SCRIPT_URL = "SUA_URL_DO_APPS_SCRIPT_AQUI";

  const selectEquip = document.getElementById("equipamento");
  const badgeTag = document.getElementById("badgeTag");
  const fieldsCgt1 = document.getElementById("fieldsCgt1");
  const fieldsTrifasico = document.getElementById("fieldsTrifasico");
  const fieldsSub2 = document.getElementById("fieldsSub2");

  selectEquip.addEventListener("change", (e) => {
    const equip = e.target.value;
    badgeTag.innerText = equip;

    fieldsCgt1.classList.add("hidden");
    fieldsTrifasico.classList.add("hidden");
    fieldsSub2.classList.add("hidden");

    if (equip === "CGT-1") {
      fieldsCgt1.classList.remove("hidden");
    } else if (equip === "CGT-2" || equip === "SUBESTACAO-1") {
      fieldsTrifasico.classList.remove("hidden");
    } else if (equip === "SUBESTACAO-2") {
      fieldsSub2.classList.remove("hidden");
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    const now = new Date();
    document.getElementById("data").value = now.toISOString().split("T")[0];
    document.getElementById("hora").value = now.toTimeString().substring(0, 5);
  });

  const form = document.getElementById("checklistForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.innerText = "Enviando dados...";
    statusMsg.style.display = "none";

    const equip = selectEquip.value;
    let payload = {
      equipamento: equip,
      data: document.getElementById("data").value || "",
      hora: document.getElementById("hora").value || "",
      turno: document.getElementById("turno").value || "",
      nome: document.getElementById("nome").value || ""
    };

    if (equip === "CGT-1") {
      payload.nivel = document.getElementById("cgt1Nivel") ? document.getElementById("cgt1Nivel").value : "";
      payload.alarme = document.getElementById("cgt1Alarme") ? document.getElementById("cgt1Alarme").value : "";
      payload.ahcPercent = document.getElementById("cgt1Ahc") ? document.getElementById("cgt1Ahc").value : "";
      payload.retificadorTensao = document.getElementById("cgt1RetTensao") ? document.getElementById("cgt1RetTensao").value : "";
      payload.retificadorCorrente = document.getElementById("cgt1RetCorrente") ? document.getElementById("cgt1RetCorrente").value : "";
      payload.consumidorTensao = document.getElementById("cgt1ConsTensao") ? document.getElementById("cgt1ConsTensao").value : "";
      payload.consumidorCorrente = document.getElementById("cgt1ConsCorrente") ? document.getElementById("cgt1ConsCorrente").value : "";
      payload.ac = document.getElementById("cgt1Ac") ? document.getElementById("cgt1Ac").value : "";
      payload.corrente = document.getElementById("cgt1CorrenteAc") ? document.getElementById("cgt1CorrenteAc").value : "";
    } else if (equip === "CGT-2" || equip === "SUBESTACAO-1") {
      payload.nivel = document.getElementById("triNivel") ? document.getElementById("triNivel").value : "";
      payload.alarme = document.getElementById("triAlarme") ? document.getElementById("triAlarme").value : "";
      payload.batTensao = document.getElementById("triBatTensao") ? document.getElementById("triBatTensao").value : "";
      payload.batCorrente = document.getElementById("triBatCorrente") ? document.getElementById("triBatCorrente").value : "";
      payload.consTensao = document.getElementById("triConsTensao") ? document.getElementById("triConsTensao").value : "";
      payload.consCorrente = document.getElementById("triConsCorrente") ? document.getElementById("triConsCorrente").value : "";
      payload.retifTensao = document.getElementById("triRetifTensao") ? document.getElementById("triRetifTensao").value : "";
      payload.retifCorrente = document.getElementById("triRetifCorrente") ? document.getElementById("triRetifCorrente").value : "";
      payload.redeR = document.getElementById("triRedeR") ? document.getElementById("triRedeR").value : "";
      payload.redeS = document.getElementById("triRedeS") ? document.getElementById("triRedeS").value : "";
      payload.redeT = document.getElementById("triRedeT") ? document.getElementById("triRedeT").value : "";
    } else if (equip === "SUBESTACAO-2") {
      payload.alarme = document.getElementById("sub2Alarme") ? document.getElementById("sub2Alarme").value : "";
      payload.correnteAc = document.getElementById("sub2CorrenteAc") ? document.getElementById("sub2CorrenteAc").value : "";
      payload.cons = document.getElementById("sub2Cons") ? document.getElementById("sub2Cons").value : "";
      payload.corBat = document.getElementById("sub2CorBat") ? document.getElementById("sub2CorBat").value : "";
      payload.corCons = document.getElementById("sub2CorCons") ? document.getElementById("sub2CorCons").value : "";
      payload.corTotal = document.getElementById("sub2CorTotal") ? document.getElementById("sub2CorTotal").value : "";
      payload.tempCarga = document.getElementById("sub2TempCarga") ? document.getElementById("sub2TempCarga").value : "";
      payload.redeFf = document.getElementById("sub2RedeFf") ? document.getElementById("sub2RedeFf").value : "";
    }

    const formData = new URLSearchParams();
    for (const key in payload) {
      formData.append(key, payload[key]);
    }

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
      });

      statusMsg.className = "status-box success";
      statusMsg.innerText = `✓ Inspeção gravada com sucesso na aba [${equip}]!`;
      statusMsg.style.display = "block";

      const currentDate = document.getElementById("data").value;
      const currentHora = document.getElementById("hora").value;
      const currentTurno = document.getElementById("turno").value;
      const currentNome = document.getElementById("nome").value;
      const currentEquip = selectEquip.value;

      form.reset();

      document.getElementById("data").value = currentDate;
      document.getElementById("hora").value = currentHora;
      document.getElementById("turno").value = currentTurno;
      document.getElementById("nome").value = currentNome;
      selectEquip.value = currentEquip;
      selectEquip.dispatchEvent(new Event("change"));
    } catch (err) {
      statusMsg.className = "status-box error";
      statusMsg.innerText = "✕ Erro ao registrar. Verifique a conexão.";
      statusMsg.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Gravar Inspeção";
    }
  });
</script>
</body>
</html>
