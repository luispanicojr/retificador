<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist Baterias / Retificador — CGT-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background-color: #131b26;
      border: 1px solid #243247;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #182232 0%, #101d2d 100%);
      padding: 22px 28px;
      border-bottom: 1px solid #243247;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-info h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .header-info p {
      font-size: 0.8rem;
      color: #8493a8;
      margin-top: 2px;
    }

    .tag-badge {
      background-color: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    form {
      padding: 28px;
    }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 14px 0;
    }

    .section-divider:first-of-type {
      margin-top: 0;
    }

    .section-divider span {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #10b981;
      white-space: nowrap;
    }

    .section-divider .line {
      height: 1px;
      background-color: #243247;
      width: 100%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 500px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8493a8;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background-color: #0e1520;
      border: 1px solid #243247;
      color: #f1f5f9;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      color-scheme: dark;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    input::placeholder {
      color: #435368;
    }

    .submit-btn {
      width: 100%;
      margin-top: 18px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #2a3749;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-box.success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-header">
      <div class="header-info">
        <h1>Checklist Técnico</h1>
        <p>Baterias & Retificadores</p>
      </div>
      <div class="tag-badge">CGT-1</div>
    </div>

    <form id="checklistForm">
      <!-- Seção Dados Gerais -->
      <div class="section-divider">
        <span>Informações da Inspeção</span>
        <div class="line"></div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data" required />
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="turno">Turno</label>
          <select id="turno" required>
            <option value="A">Turno A</option>
            <option value="B">Turno B</option>
            <option value="C">Turno C</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nome">Nome do Operador</label>
          <input type="text" id="nome" required placeholder="Ex: Luis / Bruno" />
        </div>
      </div>

      <!-- Seção Baterias -->
      <div class="section-divider">
        <span>Status do Banco de Baterias</span>
        <div class="line"></div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label for="nivel">Nível</label>
          <input type="text" id="nivel" required placeholder="Ex: NA, N, MA" />
        </div>
        <div class="form-group">
          <label for="alarmeBateria">Alarme</label>
          <select id="alarmeBateria" required>
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ahcPercent">AHC %</label>
          <input type="number" step="0.1" id="ahcPercent" required placeholder="100" />
        </div>
      </div>

      <!-- Seção Retificador & Consumidor -->
      <div class="section-divider">
        <span>Retificador & Consumidor (CC)</span>
        <div class="line"></div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="retificadorTensao">Retificador - Tensão (V)</label>
          <input type="number" step="0.1" id="retificadorTensao" required placeholder="Ex: 132.0" />
        </div>
        <div class="form-group">
          <label for="retificadorCorrente">Retificador - Corrente (A)</label>
          <input type="number" step="0.1" id="retificadorCorrente" required placeholder="Ex: 5.7" />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="consumidorTensao">Consumidor - Tensão (V)</label>
          <input type="number" step="0.1" id="consumidorTensao" required placeholder="Ex: 124.0" />
        </div>
        <div class="form-group">
          <label for="consumidorCorrente">Consumidor - Corrente (A)</label>
          <input type="number" step="0.1" id="consumidorCorrente" required placeholder="Ex: 5.7" />
        </div>
      </div>

      <!-- Seção Alimentação AC -->
      <div class="section-divider">
        <span>Entrada AC Retificador</span>
        <div class="line"></div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="retificadorAc">Tensão AC (V)</label>
          <input type="number" step="0.1" id="retificadorAc" required placeholder="Ex: 432.0" />
        </div>
        <div class="form-group">
          <label for="retificadorCorrenteAc">Corrente AC</label>
          <input type="number" step="0.1" id="retificadorCorrenteAc" required placeholder="Ex: 0" />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Gravar Inspeção</span>
      </button>

      <div id="statusMsg" class="status-box"></div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyohOxP74eGK_PAIPfsEUxtmBLLuvZp3m1s3ZA1eEmUb0NA_D2pVADLEnpNAWJiCjK6/exec";

    // Auto-preenchimento de data/hora atuais
    window.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      document.getElementById("data").value = now.toISOString().split("T")[0];
      document.getElementById("hora").value = now.toTimeString().substring(0, 5);
    });

    const form = document.getElementById("checklistForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "Enviando dados...";
      statusMsg.style.display = "none";

      const payload = {
        data: document.getElementById("data").value,
        hora: document.getElementById("hora").value,
        turno: document.getElementById("turno").value,
        nome: document.getElementById("nome").value,
        nivel: document.getElementById("nivel").value,
        alarmeBateria: document.getElementById("alarmeBateria").value,
        ahcPercent: document.getElementById("ahcPercent").value,
        retificadorTensao: document.getElementById("retificadorTensao").value,
        retificadorCorrente: document.getElementById("retificadorCorrente").value,
        consumidorTensao: document.getElementById("consumidorTensao").value,
        consumidorCorrente: document.getElementById("consumidorCorrente").value,
        retificadorAc: document.getElementById("retificadorAc").value,
        retificadorCorrenteAc: document.getElementById("retificadorCorrenteAc").value
      };

      const formData = new URLSearchParams();
      for (const key in payload) {
        formData.append(key, payload[key]);
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData.toString()
        });

        statusMsg.className = "status-box success";
        statusMsg.innerText = "✓ Inspeção registrada com sucesso na planilha!";
        statusMsg.style.display = "block";
        
        const currentDate = document.getElementById("data").value;
        const currentHora = document.getElementById("hora").value;
        const currentTurno = document.getElementById("turno").value;
        const currentNome = document.getElementById("nome").value;
        
        form.reset();
        
        document.getElementById("data").value = currentDate;
        document.getElementById("hora").value = currentHora;
        document.getElementById("turno").value = currentTurno;
        document.getElementById("nome").value = currentNome;
      } catch (err) {
        statusMsg.className = "status-box error";
        statusMsg.innerText = "✕ Erro ao registrar. Verifique a conexão com a internet.";
        statusMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Gravar Inspeção";
      }
    });
  </script>
</body>
</html>
